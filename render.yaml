services:
  - type: web
    name: words-for-us
    runtime: node
    plan: free
    region: singapore
    # Render는 NODE_ENV=production을 설정하고, 그러면 npm이 devDependencies를 건너뛴다.
    # vite가 devDependency라서 --include=dev 없이는 빌드가 "vite: not found"로 실패한다.
    buildCommand: npm install --include=dev && npm run build
    # 시딩은 동일 content를 건너뛰므로 매 부팅마다 실행해도 데이터가 중복되지 않는다.
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production

      # Turso 접속 정보. sync: false 이므로 Render 대시보드에서 직접 입력한다.
      # 이 두 값이 있으면 데이터가 Turso에 영구 저장되고, 없으면 임시 로컬 파일에 저장된다.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # DB 엔진에 맞는 드라이버. 대시보드에서 Turso 엔진을 골랐다면 turso로 바꾼다.
      - key: TURSO_DRIVER
        value: libsql
